name: TravelAI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Backend
    env:
      GROQ_API_KEY: test-key
      MONGODB_URI: mongodb://localhost:27017
      SERPAPI_API_KEY: ''
      RAG_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python run_regressions.py
  optional-rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      GROQ_API_KEY: test-key
      MONGODB_URI: mongodb://localhost:27017
      SERPAPI_API_KEY: ''
      RAG_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-rag.txt
      - run: python -m pip install -r requirements-rag.txt
      - run: python -m pip check
      - run: python rag_tests.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:deploy
        env:
          VITE_FASTAPI_URL: https://travelai-ci-check.onrender.com
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
